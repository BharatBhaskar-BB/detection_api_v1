# ══════════════════════════════════════════════════════════════════════
# BundleBox Unified Stack — SC1 + Florence (live-detection)
# ══════════════════════════════════════════════════════════════════════
# TEST MODE: Uses offset ports so Belgin's containers can run in parallel.
#   backend     8010  (prod: 8000)
#   pipeline    8110  (prod: 8100)
#   florence    8210  (prod: 8200)
#   frontend    3010  (prod: 3000)
#   rabbitmq    5682  (prod: 5672)
#
# Usage:
#   docker compose -p bb -f deploy/docker-compose.unified.yml --env-file deploy/.env.prod up -d --build
#
# After testing, stop Belgin's containers and switch gateway.
# ══════════════════════════════════════════════════════════════════════

services:
  # ── Message Queue ──────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5682:5672"
      - "15682:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend (FastAPI — auth, scans, inventory) ─────────────
  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      PIPELINE_BACKEND_URL: http://pipeline_backend:8100
      DATABASE_URL: sqlite+aiosqlite:////app/data/bundlebox.db
    ports:
      - "8010:8000"
    volumes:
      - app-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Pipeline Backend (video processing + WebSocket) ────────
  pipeline_backend:
    build:
      context: ..
      dockerfile: pipeline_service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      PIPELINE_API_PREFIX: /api/detection/v1
      PIPELINE_CALLBACK_URL: http://backend:8000/api/v1/pipeline-callback/event
      STORE_DB: "false"
      DATABASE_URL: sqlite+aiosqlite:////app/data/bundlebox.db
    ports:
      - "8110:8100"
    volumes:
      - app-data:/app/data
      - /home/bharat_bhaskar/results:/app/results
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Florence / Live Detection ──────────────────────────────
  florence:
    build:
      context: ../florence
    restart: unless-stopped
    env_file:
      - .env.florence
    environment:
      ROUTE_PREFIX: /live-detection
    ports:
      - "8210:8100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Frontend (React SPA + nginx proxy) ─────────────────────
  frontend:
    build:
      context: ../frontend
      args:
        VITE_BASE_PATH: /scanner/sc1
    restart: unless-stopped
    ports:
      - "3010:80"
    volumes:
      - ./frontend-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - pipeline_backend

volumes:
  app-data:
  rabbitmq-data:
