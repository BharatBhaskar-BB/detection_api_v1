# Frontend nginx — routes API calls to compose services
# Mounted into frontend container at /etc/nginx/conf.d/default.conf

client_max_body_size 2G;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Pipeline API (must come before /api/ catch-all)
    location /api/detection/ {
        proxy_pass http://pipeline_backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
