# ══════════════════════════════════════════════════════════════
# BundleBox Gateway — nginx reverse proxy
# ══════════════════════════════════════════════════════════════
# This config routes all traffic from the GCP ALB to the
# correct backend containers on the VM.
#
# Deploy: copy to /home/bharat.bhaskar/gateway/nginx.conf
#         then: docker restart gateway
#
# Port mapping (TEST MODE — offset ports):
#   backend:     8010
#   pipeline:    8110
#   florence:    8210
#   frontend:    3010
#
# After stopping Belgin's containers, switch to standard ports
# (8000, 8100, 8200, 3000) and update this file.
# ══════════════════════════════════════════════════════════════

events {
    worker_connections 1024;
}

http {
    client_max_body_size 2G;

    # Timeouts for long-running video processing
    proxy_connect_timeout 60s;
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;

    # WebSocket upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # ── Pipeline API (/api/detection/*) ──────────────────
        # Must come before /api/ catch-all
        location /api/detection/ {
            proxy_pass http://127.0.0.1:8110;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Backend API (/api/*) ────────────────────────────
        location /api/ {
            proxy_pass http://127.0.0.1:8010;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Pipeline direct (/pipeline/*) ───────────────────
        location /pipeline/ {
            proxy_pass http://127.0.0.1:8110;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # ── Florence / Live Detection ───────────────────────
        location /live-detection/ {
            proxy_pass http://127.0.0.1:8210/live-detection/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }

        # ── Frontend SPA (catch-all) ────────────────────────
        location / {
            proxy_pass http://127.0.0.1:3010;
            proxy_http_version 1.1;
            proxy_set_header Host       $host;
            proxy_set_header X-Real-IP  $remote_addr;
        }
    }
}
