version: "3.8"

services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend (FastAPI + SQLite + GPU) ──
  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - app-data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Pipeline Backend (Gemini + WebSocket) ──
  pipeline_backend:
    build:
      context: ..
      dockerfile: pipeline_service/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8100:8100"
    volumes:
      - app-data:/app/data
    depends_on:
      backend:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ── Frontend (nginx, serves SPA + proxies /api/) ──
  frontend:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - pipeline_backend

volumes:
  app-data:
  rabbitmq-data:
